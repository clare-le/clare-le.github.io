<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#3e9bd0" />
  <title>航海小英雄</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game" aria-label="航海小英雄 3D 航海遊戲">
    <div id="scene" aria-hidden="true"></div>

    <div class="hud" aria-live="polite">
      <div class="meter">
        <span>航速</span>
        <strong><b id="speed">0.0</b> kn</strong>
        <small>油門 <b id="throttle">0</b>/5</small>
      </div>
      <div class="meter meter-right">
        <span>航向</span>
        <strong><b id="heading">0</b>°</strong>
        <small id="bearing">北</small>
      </div>
    </div>

    <div id="loading">正在放船下水...</div>

    <section class="controls" aria-label="船隻控制">
      <button class="control" data-control="left" aria-label="左轉" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>

      <div class="speed-controls">
        <button class="control" data-control="brake" aria-label="降低油門" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
        </button>
        <button class="control primary" data-control="throttle" aria-label="提高油門" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
      </div>

      <button class="control" data-control="right" aria-label="右轉" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
      </button>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
