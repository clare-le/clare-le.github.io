<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#3e9bd0" />
  <title>航海小英雄</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game" aria-label="航海小英雄 3D 航海遊戲">
    <div id="scene" aria-hidden="true"></div>

    <div class="hud" aria-live="polite">
      <div class="meter meter-fuel">
        <span>油量</span>
        <strong><b id="fuel">100</b><i>%</i></strong>
        <small><b id="fuel-liters">360</b> L</small>
      </div>
      <button
        class="meter meter-rpm panel-trigger"
        id="engine-panel-trigger"
        data-panel-trigger="engine"
        aria-controls="instrument-drawer"
        aria-expanded="false"
        type="button"
      >
        <span>RPM</span>
        <strong id="rpm">650</strong>
        <small>檔位 <b id="throttle">0</b></small>
      </button>
      <div class="meter meter-speed">
        <span>航速</span>
        <strong><b id="speed">0.0</b><i>kn</i></strong>
        <small id="travel-multiplier">近岸 ×1</small>
      </div>
      <div class="meter meter-position">
        <span>經緯度</span>
        <strong id="latitude">22.61°N</strong>
        <small id="longitude">120.29°E</small>
      </div>
      <button
        class="meter meter-bearing panel-trigger"
        id="gps-panel-trigger"
        data-panel-trigger="gps"
        aria-controls="instrument-drawer"
        aria-expanded="false"
        type="button"
      >
        <span>導航方向</span>
        <strong id="bearing">西北</strong>
      </button>
      <div class="meter meter-heading">
        <span>航向</span>
        <strong><b id="heading">0</b><i>°</i></strong>
      </div>
    </div>

    <section
      class="instrument-drawer"
      id="instrument-drawer"
      aria-label="儀表詳細資訊"
      aria-hidden="true"
    >
      <div class="instrument-panel" data-instrument-panel="gps" hidden>
        <header class="panel-header">
          <div class="panel-title">
            <small>GPS CHART</small>
            <h2>台灣海域</h2>
          </div>
          <div class="chart-ranges" role="group" aria-label="海圖顯示範圍">
            <button data-chart-range="1" aria-pressed="false" type="button">1 km</button>
            <button data-chart-range="10" aria-pressed="false" type="button">10 km</button>
            <button class="selected" data-chart-range="100" aria-pressed="true" type="button">100 km</button>
          </div>
          <button class="panel-close" data-panel-close type="button" aria-label="關閉 GPS 海圖">×</button>
        </header>
        <canvas id="gps-chart" class="gps-chart" aria-label="台灣與澎湖 GPS 海圖"></canvas>
        <footer class="gps-readout">
          <strong id="gps-position">22.6050°N 120.2870°E</strong>
          <span><b id="gps-course">315°</b> · <b id="gps-scale">近岸 ×1</b></span>
        </footer>
      </div>

      <div class="instrument-panel" data-instrument-panel="engine" hidden>
        <header class="panel-header">
          <div class="panel-title">
            <small>ENGINE MONITOR</small>
            <h2 id="engine-model">小貨船柴油機</h2>
          </div>
          <button class="panel-close" data-panel-close type="button" aria-label="關閉引擎狀態">×</button>
        </header>
        <div class="engine-primary">
          <div>
            <span>轉速</span>
            <strong><b id="engine-detail-rpm">650</b> <i>RPM</i></strong>
          </div>
          <div>
            <span>狀態</span>
            <strong id="engine-condition">正常</strong>
          </div>
        </div>
        <div class="engine-readings">
          <div class="engine-reading">
            <span>引擎負載</span>
            <strong><b id="engine-load">6</b>%</strong>
            <div class="engine-bar"><i id="engine-load-bar"></i></div>
          </div>
          <div class="engine-reading">
            <span>冷卻水溫</span>
            <strong><b id="engine-temperature">72</b>°C</strong>
          </div>
          <div class="engine-reading">
            <span>機油壓力</span>
            <strong><b id="engine-oil-pressure">1.6</b> bar</strong>
          </div>
          <div class="engine-reading">
            <span>充電電壓</span>
            <strong><b id="engine-voltage">13.8</b> V</strong>
          </div>
          <div class="engine-reading">
            <span>即時耗油</span>
            <strong><b id="engine-fuel-flow">1.7</b> L/h</strong>
          </div>
          <div class="engine-reading">
            <span>檔位</span>
            <strong id="engine-gear">N</strong>
          </div>
        </div>
      </div>
    </section>

    <div id="shore-status" role="status" hidden></div>

    <div id="loading">正在放船下水...</div>

    <section class="controls" aria-label="船隻控制">
      <button class="control" data-control="left" aria-label="左轉" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>

      <div class="speed-controls">
        <button class="control" data-control="brake" aria-label="降低油門或切入倒俥" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
        </button>
        <button class="control primary" data-control="throttle" aria-label="提高油門或切回前進" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
      </div>

      <button class="control" data-control="right" aria-label="右轉" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
      </button>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
